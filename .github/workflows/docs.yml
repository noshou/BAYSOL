name: Documentation

on:
  # master -> the "dev" docs; a version tag (v0.2.0, ...) -> that version's
  # docs (plain vX.Y.Z tags only). workflow_dispatch still allows a manual
  # rebuild of either (pick the branch or the tag in the Actions UI).
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # actions/checkout leaves the pushed tag lightweight (it fetches the commit only),
      # which loses the tag's message: the release name docs/make.jl shows under the
      # sidebar title. Fetch the annotated tag itself.
      - name: Fetch the annotated tag
        if: github.ref_type == 'tag'
        run: |
          tag="refs/tags/${GITHUB_REF_NAME}"
          git fetch --force origin "${tag}:${tag}"
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install package + docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
