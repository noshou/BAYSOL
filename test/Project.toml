[compat]
Aqua = "0.8"
# CondaPkg is only a direct dep here (not just transitive via BAYSOL) because
# Preferences.jl's load_preference only honours a [preferences.CondaPkg]
# entry for a package from environments that list it as a *direct*
# dependency -- needed so this env picks up the shared-conda-environment
# preference below instead of resolving its own separate .CondaPkg.
CondaPkg = "0.2"
Distributions = "0.25.131"
ExplicitImports = "1.15.0"
ForwardDiff = "0.10, 1"
JET = "0.9, 0.10, 0.11, 0.12"

# See ../Project.toml's matching block for the full rationale.
[preferences.CondaPkg]
backend = "MicroMamba"
env = "@baysol"
