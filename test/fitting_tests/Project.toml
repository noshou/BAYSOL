[deps]
BAYSOL = "f10a6c88-74b5-485f-9c8c-589f8f9e3c2a"
# Direct dep so this env's [preferences.CondaPkg] below is actually honoured
# -- Preferences.jl only reads preferences for a package from environments
# that list it as a direct dependency, not a transitive one.
CondaPkg = "992eb4ea-22a4-4c89-a5bb-47a3300528ab"
DelimitedFiles = "8bb1440f-4735-579b-a4ab-409b98df4dab"
GLMakie = "e9467ef8-e4e7-5192-8a1a-b1aee30e663a"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"

[compat]
CondaPkg = "0.2"

# Shared conda environment across every BAYSOL-dependent project in this
# repo -- see ../../Project.toml for the full rationale.
[preferences.CondaPkg]
backend = "MicroMamba"
env = "@baysol"
